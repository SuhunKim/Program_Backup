<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .pcb-root { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .pcb-card { background:#FFFFFF; border:1px solid #DCE8E5; border-radius:8px; box-shadow:0 1px 2px rgba(36,49,56,0.04); }
    .pcb-btn-primary { background:#2FA894; color:#fff; border:none; border-radius:6px; padding:9px 22px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
    .pcb-btn-primary:hover { background:#268F7E; }
    .pcb-btn-primary:active { background:#1F7A6B; }
    .pcb-btn-secondary { background:#FFFFFF; color:#243138; border:1px solid #DCE8E5; border-radius:6px; padding:9px 22px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
    .pcb-btn-secondary:hover { background:#EAF5F2; }
    .pcb-radio-card { display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border:1px solid #DCE8E5; border-radius:8px; background:#FFFFFF; cursor:pointer; }
    .pcb-radio-card--selected { border-color:#2FA894; background:#EAF5F2; }
    .pcb-radio { width:16px; height:16px; border-radius:50%; border:1.6px solid #B9CFC9; flex-shrink:0; margin-top:2px; position:relative; background:#fff; }
    .pcb-radio--on { border-color:#2FA894; }
    .pcb-radio--on::after { content:''; position:absolute; inset:3px; border-radius:50%; background:#2FA894; }
    .pcb-nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:7px; text-decoration:none; font-size:13.5px; font-weight:500; color:#243138; }
    .pcb-nav-item:hover { background:#E0F0EC; }
    .pcb-nav-item--active { background:#D6EEE7; color:#1F7A6B; font-weight:600; }
    .pcb-nav-item--active:hover { background:#D6EEE7; }
    a { color:#2FA894; text-decoration:none; }
    a:hover { color:#1F7A6B; }
  </style>
</helmet>
<div class="pcb-root" style="width:1400px;height:820px;background:#F2F8F6;display:flex;overflow:hidden;color:#243138;">

  <aside style="width:220px;min-width:220px;background:#EAF5F2;border-right:1px solid #DCE8E5;display:flex;flex-direction:column;height:100%;">
    <div style="display:flex;align-items:center;gap:10px;padding:22px 20px 20px;">
      <div style="width:36px;height:36px;border-radius:9px;background:#2FA894;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 15h8a3 3 0 0 0 .5-5.96A4.5 4.5 0 0 0 6.1 8.51 3.5 3.5 0 0 0 6 15Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 12V7m0 0-2 2m2-2 2 2" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;line-height:1.25;">
        <span style="font-size:13px;font-weight:700;color:#243138;letter-spacing:0.02em;">PC BACKUP</span>
        <span style="font-size:13px;font-weight:700;color:#243138;letter-spacing:0.02em;">MANAGER</span>
      </div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px;padding:8px 12px;flex:1;">
      <a href="#" class="pcb-nav-item pcb-nav-item--active">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M6 15h8a3 3 0 0 0 .5-5.96A4.5 4.5 0 0 0 6.1 8.51 3.5 3.5 0 0 0 6 15Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 12V7m0 0-2 2m2-2 2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        01 백업
      </a>
      <a href="#" class="pcb-nav-item">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 10a6 6 0 1 1 1.76 4.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 14v-3h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        02 복원
      </a>
      <a href="#" class="pcb-nav-item">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v3.5l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        03 이력 관리
      </a>
      <a href="#" class="pcb-nav-item">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M10 3.5v1.6M10 14.9v1.6M16.5 10h-1.6M5.1 10H3.5M14.6 5.4l-1.13 1.13M6.53 13.47 5.4 14.6M14.6 14.6l-1.13-1.13M6.53 6.53 5.4 5.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        04 환경 설정
      </a>
    </nav>
    <div style="padding:16px 20px;border-top:1px solid #DCE8E5;font-size:11.5px;color:#6B7B82;">v0.1 Foundation</div>
  </aside>

  <main style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <header style="padding:22px 32px 18px;border-bottom:1px solid #DCE8E5;background:#FFFFFF;">
      <div style="font-size:20px;font-weight:700;color:#243138;">백업</div>
      <div style="font-size:13px;color:#6B7B82;margin-top:4px;">지정된 프로그램 폴더를 ZIP 파일로 백업합니다.</div>
    </header>

    <div style="flex:1;overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:20px;">

      <div class="pcb-card" style="padding:18px 22px;">
        <div style="font-size:13px;font-weight:600;color:#243138;margin-bottom:12px;">대상 정보</div>
        <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:16px;">
          <div>
            <div style="font-size:11.5px;color:#6B7B82;margin-bottom:4px;">프로젝트</div>
            <div style="font-size:13.5px;color:#243138;font-weight:600;">PLCSimulator</div>
          </div>
          <div>
            <div style="font-size:11.5px;color:#6B7B82;margin-bottom:4px;">원본 위치</div>
            <div style="font-size:13px;color:#243138;">D:\_program\PLCSimulator</div>
          </div>
          <div>
            <div style="font-size:11.5px;color:#6B7B82;margin-bottom:4px;">백업 위치</div>
            <div style="font-size:13px;color:#243138;">D:\Backup\PLCSimulator</div>
          </div>
        </div>
      </div>

      <div>
        <div style="font-size:13px;font-weight:600;color:#243138;margin-bottom:10px;">백업 방식</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <label class="pcb-radio-card pcb-radio-card--selected">
            <span class="pcb-radio pcb-radio--on"></span>
            <span>
              <span style="display:block;font-size:13.5px;font-weight:600;color:#243138;">전체 ZIP</span>
              <span style="display:block;font-size:12px;color:#6B7B82;margin-top:2px;">원본 루트 전체를 압축합니다 (백업 폴더 자신은 제외).</span>
            </span>
          </label>
          <label class="pcb-radio-card">
            <span class="pcb-radio"></span>
            <span>
              <span style="display:block;font-size:13.5px;font-weight:600;color:#243138;">지정 폴더 선별 백업</span>
              <span style="display:block;font-size:12px;color:#6B7B82;margin-top:2px;">환경설정에 등록된 폴더만 압축합니다 (_bin, Config).</span>
            </span>
          </label>
        </div>
      </div>

      <div class="pcb-card" style="padding:18px 22px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="font-size:13px;font-weight:600;color:#243138;">진행 상태</span>
          <span style="font-size:12px;color:#6B7B82;">대기 중</span>
        </div>
        <div style="height:8px;background:#EAF5F2;border-radius:999px;overflow:hidden;">
          <div style="height:100%;width:0%;background:#2FA894;border-radius:999px;"></div>
        </div>
        <div style="font-size:12px;color:#6B7B82;margin-top:8px;">백업을 시작하면 파일 단위 진행률이 여기에 표시됩니다.</div>
      </div>

    </div>

    <div style="padding:14px 32px;border-top:1px solid #DCE8E5;background:#FFFFFF;display:flex;justify-content:flex-end;gap:10px;">
      <button class="pcb-btn-secondary">취소</button>
      <button class="pcb-btn-primary">백업 시작</button>
    </div>
  </main>

</div>
</x-dc>
</body>
</html>
